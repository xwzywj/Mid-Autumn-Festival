<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>生日祝福</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<audio id="bgm" src="assets/music.mp3" loop></audio>


<div class="sky">


<div class="moon"></div>

<div class="stars"></div>

<div class="flowers"></div>



<!-- 首页 -->

<div class="content" id="home">


<h1>🎂 生日快乐</h1>


<h2>给【贾鑫】</h2>


<p>
在这个月圆之夜<br>
愿你的新一岁<br>
平安、快乐、顺利
</p>



<button onclick="openLetter()">

✨ 打开这份祝福

</button>


</div>





<!-- 信件页面 -->

<div id="letter">


<div class="paper">


<h2>
给【贾鑫】的一封信
</h2>


<div id="words"></div>


</div>


</div>






<!-- 礼物页面 -->

<div id="gift">


<div class="gift-box">


<h1>
🎁 给你的生日礼物
</h1>


<p>
还有一个小惊喜
</p>


<button onclick="showGift()">

打开礼物

</button>



<div id="giftLink">


<div class="address">


<h2>
📦 礼物已经准备好了
</h2>


<p>
收件人：【贾鑫】
</p>


<p>
地址：【甘肃省兰州市安宁区西路街道安宁区西路88号兰州交通大学校内南苑9号公寓】
</p>


<p>
希望这份礼物可以给你带来一点惊喜 ❤️不可以拒绝
</p>


</div>


</div>


</div>


</div>




</div>


<script src="script.js"></script>


</body>

</html>
